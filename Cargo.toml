[package]
name = "local-wiki-base"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
comrak = "0.20"
walkdir = "2"
fuzzy-matcher = "0.3"
chrono = "0.4"
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "sqlite", "chrono"] }
regex = "1.10"